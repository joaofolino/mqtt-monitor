title: MQTT Monitor
views:
  - title: Server Monitor
    path: mqtt-monitor
    icon: mdi:server
    cards:
      - type: entities
        title: Host Overview
        show_header_toggle: false
        entities:
          - sensor.server_cpu_load_percentage
          - sensor.server_memory_used_megabytes
          - sensor.server_cpu_temperature_celsius
          - sensor.server_active_issue_count
          - sensor.server_highest_issue_severity

      - type: markdown
        title: Active Issues
        content: |
          {% set issues = state_attr('sensor.server_active_issue_count', 'active_issues') or [] %}
          {% if issues | count == 0 %}
          No active issues.
          {% else %}
          {% for issue in issues %}
          - **{{ issue.title }}** ({{ issue.severity }}): {{ issue.description }}
          {% endfor %}
          {% endif %}

      - type: entities
        title: Filesystems
        show_header_toggle: false
        entities:
          - sensor.server_root_disk_usage_percentage
          - sensor.server_var_log_disk_usage_percentage

      - type: entities
        title: RAID Arrays
        show_header_toggle: false
        entities:
          - sensor.raid_md0_status
          - sensor.raid_md1_status

      - type: entities
        title: LXC Containers
        show_header_toggle: false
        entities:
          - binary_sensor.server_container_web_running
          - binary_sensor.server_container_mail_running
          - binary_sensor.server_container_emby_running

      - type: entities
        title: Disk sda
        show_header_toggle: false
        entities:
          - sensor.disk_sda_smart_health_status
          - sensor.disk_sda_capacity_gib
          - sensor.disk_sda_max_temperature
          - sensor.disk_sda_power_on_hours
          - sensor.disk_sda_read_kilobytes_per_second
          - sensor.disk_sda_write_kilobytes_per_second
          - sensor.disk_sda_busy_time_percentage

      - type: entities
        title: Disk sdb
        show_header_toggle: false
        entities:
          - sensor.disk_sdb_smart_health_status
          - sensor.disk_sdb_capacity_gib
          - sensor.disk_sdb_max_temperature
          - sensor.disk_sdb_power_on_hours
          - sensor.disk_sdb_read_kilobytes_per_second
          - sensor.disk_sdb_write_kilobytes_per_second
          - sensor.disk_sdb_busy_time_percentage
