# [monitor] Section: General monitoring settings
[monitor]

# enable_email: Enable sending email alerts for critical events (e.g., RAID degradation).
# Options: true, false
# Default: false
enable_email = false
#enable_email = true

# log_level: Logging verbosity level.
# Options: DEBUG (verbose), INFO (normal), WARNING, ERROR
# Default: INFO
log_level = INFO
#log_level = DEBUG

# enable_io_mqtt: Enable publishing disk I/O rates to MQTT.
# Options: true, false
# Default: true
enable_io_mqtt = true
#enable_io_mqtt = false

# alert_email: Email address to receive alerts.
# Options: Valid email address
# Default: user@example.com
alert_email = user@example.com
#alert_email = joao.oliveira.lino@gmail.com

# smtp_server: SMTP server for sending email alerts.
# Options: Valid SMTP server hostname
# Default: smtp.gmail.com
smtp_server = smtp.gmail.com
#smtp_server = smtp.gmail.com

# smtp_port: SMTP server port.
# Options: Integer (typically 587 for TLS)
# Default: 587
smtp_port = 587
#smtp_port = 587

# smtp_user: SMTP username for authentication.
# Options: Valid username
# Default: user@example.com
smtp_user = user@example.com
#smtp_user = joao.oliveira.lino@gmail.com

# smtp_pass: SMTP password or app-specific password.
# Options: Valid password
# Default: your-app-password
smtp_pass = your-app-password
#smtp_pass = app-password

# package_version: Desired package version or 'latest' for automatic updates.
# Options: Specific version (e.g., 1.0-1), latest
# Default: latest
package_version = latest
#package_version = 2.0-1

# [mqtt] Section: MQTT broker settings
[mqtt]

# broker: MQTT broker hostname or IP address.
# Options: Valid hostname or IP
# Default: localhost
broker = localhost
#broker = 10.0.0.120

# port: MQTT broker port.
# Options: Integer (typically 1883)
# Default: 1883
port = 1883
#port = 1883

# mqtt_user: MQTT username for authentication.
# Options: Valid username
# Default: mqtt-user
mqtt_user = mqtt-user
#mqtt_user = mqtt-server

# mqtt_pass: MQTT password.
# Options: Valid password
# Default: mqtt-password
mqtt_pass = mqtt-password
#mqtt_pass = mqtt-password

# self_name: Unique identifier for this monitor instance.
# Options: String
# Default: mqtt-monitor
self_name = mqtt-monitor
#self_name = mqtt-monitor-container

# [internals] Section: Internal monitoring parameters
[internals]

# smart_interval: Interval (seconds) between SMART checks.
# Options: Integer
# Default: 900
smart_interval = 900
#smart_interval = 900

# topic_prefix: MQTT topic prefix for published metrics.
# Options: String
# Default: home/server/mqtt-monitor
topic_prefix = home/server/mqtt-monitor
#topic_prefix = home/server/mqtt-monitor

# log_dir: Directory for log files.
# Options: Valid directory path
# Default: /var/log
log_dir = /var/log
#log_dir = /var/log

# log_file: Path to the log file.
# Options: Valid file path
# Default: /var/log/mqtt-monitor.log
log_file = /var/log/mqtt-monitor.log
#log_file = /var/log/mqtt-monitor.log

# devices: Comma-separated list of devices to monitor.
# Options: Valid device paths (e.g., /dev/sda)
# Default: /dev/sda,/dev/sdb
devices = /dev/sda,/dev/sdb
#devices = /dev/sda,/dev/sdb,/dev/sdc,/dev/sdd,/dev/nvme0n1,/dev/md1

# raid_arrays: Comma-separated list of RAID arrays to monitor.
# Options: Valid RAID array names (e.g., md0)
# Default: md0,md1
raid_arrays = md0,md1
#raid_arrays = md0,md1,md2

# mdstat_path: Path to RAID status file.
# Options: Valid file path
# Default: /proc/mdstat
mdstat_path = /proc/mdstat
#mdstat_path = /proc/mdstat

# cpu_temp_path: Path to CPU temperature file.
# Options: Valid file path
# Default: /sys/class/thermal/thermal_zone0/temp
cpu_temp_path = /sys/class/thermal/thermal_zone0/temp
#cpu_temp_path = /sys/class/thermal/thermal_zone0/temp

# disk_usage_mounts: Comma-separated list of mount points to monitor.
# Options: Valid mount points
# Default: /,/var/log
disk_usage_mounts = /,/var/log
#disk_usage_mounts = /,/var/log

# max_io_rate: Maximum I/O rate (KB/s) to report.
# Options: Float
# Default: 10000.0
max_io_rate = 10000.0
#max_io_rate = 10000.0

# md1_usage_threshold: Disk usage threshold (%) for alerts.
# Options: Integer (0-100)
# Default: 95
md1_usage_threshold = 95
#md1_usage_threshold = 95

# md1_write_spike_threshold: Write rate threshold (KB/s) for alerts.
# Options: Float
# Default: 400
md1_write_spike_threshold = 400
#md1_write_spike_threshold = 389

# sleep_interval: Main loop sleep interval (seconds).
# Options: Float
# Default: 60
sleep_interval = 60
#sleep_interval = 60

# error_sleep: Sleep interval (seconds) after errors.
# Options: Float
# Default: 10
error_sleep = 10
#error_sleep = 10

# state_dir: Directory used to persist runtime state such as issue transitions and generated dashboards.
# Options: Valid directory path
# Default: /var/lib/mqtt-monitor
state_dir = /var/lib/mqtt-monitor
#state_dir = /var/lib/mqtt-monitor

# [discovery] Section: Automatic inventory discovery
[discovery]

# auto_discover_disks: Automatically discover block devices from /sys/block.
# Options: true, false
# Default: true
auto_discover_disks = true
#auto_discover_disks = true

# auto_discover_raid_arrays: Automatically discover RAID arrays from /proc/mdstat.
# Options: true, false
# Default: true
auto_discover_raid_arrays = true
#auto_discover_raid_arrays = true

# auto_discover_mounts: Automatically discover mounted filesystems using psutil.
# Options: true, false
# Default: true
auto_discover_mounts = true
#auto_discover_mounts = true

# auto_discover_lxc: Automatically discover local classic-LXC containers through the packaged sudo helper.
# Options: true, false
# Default: true
auto_discover_lxc = true
#auto_discover_lxc = true

# ignored_devices: Device-name prefixes skipped by auto discovery.
# Options: Comma-separated prefixes
# Default: loop,ram,zram,fd,sr,dm-
ignored_devices = loop,ram,zram,fd,sr,dm-
#ignored_devices = loop,ram,zram,fd,sr,dm-

# ignored_mounts: Mount-point prefixes skipped by auto discovery.
# Options: Comma-separated mount points
# Default: /boot/efi,/snap
ignored_mounts = /boot/efi,/snap
#ignored_mounts = /boot/efi,/snap

# expected_lxc_containers: Containers that should be running and should trigger issues when stopped.
# Options: Comma-separated container names
# Default: empty
expected_lxc_containers =
#expected_lxc_containers = web,mail,emby

# [home_assistant] Section: Home Assistant integration
[home_assistant]

# generate_dashboard: Write a Home Assistant dashboard YAML file from the discovered inventory.
# Options: true, false
# Default: true
generate_dashboard = true
#generate_dashboard = true

# dashboard_output_path: Destination path for the generated dashboard YAML file.
# Options: Valid file path
# Default: /var/lib/mqtt-monitor/home-assistant-dashboard.yaml
dashboard_output_path = /var/lib/mqtt-monitor/home-assistant-dashboard.yaml
#dashboard_output_path = /config/dashboards/mqtt-monitor.yaml

# url: Base URL for Home Assistant. Required for notifications.
# Options: Valid URL
# Default: empty
url =
#url = https://ha.example.com

# token: Long-lived access token used for Home Assistant service calls.
# Options: Valid token
# Default: empty
token =
#token = your-long-lived-access-token

# notify_service: Optional Home Assistant notify service used for push notifications.
# Options: Valid Home Assistant service name
# Default: empty
notify_service =
#notify_service = notify.mobile_app_phone

# persistent_notifications: Create or dismiss persistent notifications for issue transitions.
# Options: true, false
# Default: true
persistent_notifications = true
#persistent_notifications = true

# notify_on_new_issue: Send Home Assistant notifications when a new issue starts.
# Options: true, false
# Default: true
notify_on_new_issue = true
#notify_on_new_issue = true

# notify_on_resolve: Send Home Assistant notifications when an issue resolves.
# Options: true, false
# Default: true
notify_on_resolve = true
#notify_on_resolve = true

# notification_minimum_severity: Lowest issue severity that should trigger Home Assistant notifications.
# Options: info, warning, critical
# Default: warning
notification_minimum_severity = warning
#notification_minimum_severity = warning
